<style>

*{ box-sizing:border-box; margin:0; padding:0; font-family:'Inter','Segoe UI',sans-serif; }
body{ min-height:100vh; background:radial-gradient(1000px 500px at 80% -10%, #262a55 0%, transparent 55%), linear-gradient(160deg,#1b1e3d,#0d0f20); color:#eef1fb; display:flex; align-items:center; justify-content:center; padding:24px; -webkit-font-smoothing:antialiased; }
.wrap{ width:100%; max-width:430px; text-align:center; }
h1{ font-size:15px; letter-spacing:2.5px; font-weight:800; background:linear-gradient(90deg,#7ee8f2,#00d0e6); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

.s{ color:#9aa3c7; font-size:13.5px; margin-bottom:32px; }
a.card{ display:flex; align-items:center; gap:16px; text-decoration:none; color:#eef1fb; background:linear-gradient(180deg,#20244a,#191c3c); border:1px solid rgba(255,255,255,.09); border-radius:18px; padding:20px; margin-bottom:14px; transition:.18s; }
a.card:hover{ transform:translateY(-3px); border-color:rgba(0,208,230,.4); box-shadow:0 16px 40px rgba(0,0,0,.4); }
a.card.gold:hover{ border-color:rgba(245,184,0,.45); }
.emoji{ font-size:32px; }
.txt{ text-align:left; }
.txt b{ font-size:16.5px; font-weight:800; display:block; }
.txt span{ font-size:12.5px; color:#9aa3c7; }
.foot{ margin-top:22px; font-size:11px; color:#69728c; }
